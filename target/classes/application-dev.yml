spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments_user
    password: payments_password

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

fraud:
  ml-service:
    enabled: false  # Use heuristic scoring locally

security:
  enabled: false  # Disable API key auth for local dev

logging:
  level:
    com.fintech.payments: DEBUG
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
