# render.yaml — Free deployment on Render.com
# See DEPLOYMENT.md for full instructions

services:
  # Payment Service (Spring Boot)
  - type: web
    name: payment-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: payments-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: payments-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: payments-redis
          type: redis
          property: port
      - key: ML_SERVICE_ENABLED
        value: "false"  # disabled on free tier (spin-down latency)
      - key: SECURITY_ENABLED
        value: "false"
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "localhost:9092"  # Kafka not available on free tier

  # ML Fraud Service (Python)
  - type: web
    name: ml-fraud-service
    env: docker
    dockerfilePath: ./ml-fraud-service/Dockerfile
    rootDir: ml-fraud-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"

databases:
  - name: payments-db
    databaseName: payments
    user: payments_user
    plan: free

# Note: Render free tier doesn't include Redis or Kafka.
# For Redis: use Upstash Redis free tier (see DEPLOYMENT.md)
# For Kafka: disable Kafka or use Upstash Kafka free tier
